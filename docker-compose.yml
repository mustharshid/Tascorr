version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: tascorr-mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: tascorr
      MARIADB_USER: tascorr_user
      MARIADB_PASSWORD: tascorr_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
